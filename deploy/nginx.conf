# /etc/nginx/sites-available/chatcartpro.com  (Hostinger VPS)
server {
    listen 80;
    server_name chatcartpro.com www.chatcartpro.com;
    root /var/www/chatcartpro/public;
    index index.html;

    # Legacy extension URLs (/pricing.html) -> clean URLs (/pricing/)
    rewrite ^/(.+)\.html$ /$1/ permanent;

    location / { try_files $uri $uri/ =404; }

    location ~* \.(css|js|png|jpg|jpeg|webp|avif|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    # Run `certbot --nginx -d chatcartpro.com -d www.chatcartpro.com` for HTTPS.
}
